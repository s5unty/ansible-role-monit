---
- name: pkg - Upgrade package
  environment:
    LANGUAGE: en_US
  unarchive:
    src: https://nexus.genscript.com/repository/it/ppa.genscript.com/monit/monit-5.34.0-linux-x64.tar.gz
    dest: /opt/
    remote_src: yes
    owner: root
    group: root

- name: pkg - Check pre-package
  stat:
    path: /usr/bin/monit
  register: s

- block:
  - name: backup
    copy:
      src: /usr/bin/monit
      dest: /usr/bin/monit.orig
      remote_src: yes

  - name: move
    file:
      path: /usr/bin/monit
      state: absent

  - name: upgrade
    file:
      src: /opt/monit-5.34.0/bin/monit
      dest: /usr/bin/monit
      state: link
  when:
    - s.stat.exists
    - s.stat.isreg

- name: pkg - /root/.monitrc
  file:
    src: "/etc/monit/monitrc"
    dest: "/etc/monitrc"
    state: link
  when:
    - ansible_facts['distribution'] in [ "Debian", 'Ubuntu' ]

- name: pkg - systemctl (>= 24.04 and Debian)
  block:
  - blockinfile:
      path: /etc/systemd/system/monit.service.d/override.conf
      create: yes
      block: |
        [Service]
        CapabilityBoundingSet=CAP_SETUID CAP_SETGID
        ReadWritePaths=/var/lib/fluent-bit/
  - shell:
      cmd: systemctl daemon-reload
  - service:
      name: monit
      state: restarted
  when: ansible_facts['distribution_version'] is version('24.04', '>=') or (ansible_distribution == "Debian")
